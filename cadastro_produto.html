<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
</head>
<body bgcolor="lightblue"> 

    <h1 align="center" ><img src="1170679.png" width="100">Cadastro de Produto Aéreo <img src="1170679.png" width="100"> </h1>

    
        <form action="principal.html">

        <label>Nome do Produto:</label><br>
        <input type="text" name="produto"><br><br>

        <label>Descrição:</label><br>
        <textarea name="descricao"></textarea><br><br>

        <label>Unidade de Medida:</label><br>
        <input type="text" name="unidade"><br><br>

        <label>Quantidade:</label><br>
        <input type="number" name="quantidade"><br><br>

        <label>Valor:</label><br>
        <input type="number" step="0.01" name="valor"><br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <br>

    <a href="principal.html">Voltar</a>

</body>
</html>
